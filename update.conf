# Repositorio de updates usado pelo update checker embutido no app.
# Preenchido pelo build.sh em build/VitaHub.apk: os placeholders
# __VitaHub_UPDATE_OWNER__ e __VitaHub_UPDATE_API_BASE__ em
# js/vitahub_android.js so sao substituidos quando OWNER e API_BASE
# tem valor. Sem isso o app informa "sem repositorio de updates" e nao
# faz nenhuma requisicao remota.
#
# URL final montada pelo app:
#   API_BASE + OWNER + '/' + REPO + '/releases/latest'
# O corpo lido precisa ter tag_name e um asset terminado em .apk.
OWNER=cleberleonheart-maker
REPO=Vitahub
API_BASE=https://api.github.com/repos/
